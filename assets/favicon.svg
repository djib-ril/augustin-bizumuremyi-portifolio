<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0F1F38" />
      <stop offset="70%" stop-color="#070C18" />
      <stop offset="100%" stop-color="#03060C" />
    </radialGradient>

    <!-- Vibrant Electric Blue to Cyan Gradient -->
    <linearGradient id="electricBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Golden/Cyan Star Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Starburst / Radial Decors -->
  <g opacity="0.45" stroke="#00D2FF" stroke-width="1.2">
    <line x1="50" y1="2" x2="50" y2="8" />
    <line x1="50" y1="92" x2="50" y2="98" />
    <line x1="2" y1="50" x2="8" y2="50" />
    <line x1="92" y1="50" x2="98" y2="50" />
    <line x1="16" y1="16" x2="20" y2="20" />
    <line x1="80" y1="80" x2="84" y2="84" />
    <line x1="84" y1="16" x2="80" y2="20" />
    <line x1="16" y1="84" x2="20" y2="80" />
  </g>

  <!-- Circular Outer Glowing Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" filter="url(#blueGlow)" />
  <circle cx="50" cy="50" r="40" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Revolving Orbit Ring Accent with Dots -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-dasharray="4 6" stroke-width="1.2" />
  <circle cx="75" cy="25" r="2.5" fill="#00D2FF" filter="url(#blueGlow)" />
  <circle cx="25" cy="75" r="2" fill="#38BDF8" />

  <!-- 4-Point Sparkle Star at Top Right -->
  <path d="M 75 14 Q 75 22 83 22 Q 75 22 75 30 Q 75 22 67 22 Q 75 22 75 14 Z" fill="#00D2FF" filter="url(#blueGlow)" />

  <!-- Monogram BA in Center -->
  <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-1.5">
    <text x="50" y="62" text-anchor="middle" fill="url(#electricBlueGrad)" filter="url(#blueGlow)">BA</text>
  </g>

  <!-- Subtle Camera Lens Aperture Dot -->
  <circle cx="50" cy="74" r="2.5" fill="#00F5D4" />
</svg>
